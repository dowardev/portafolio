# ============================================================
# portafolio — GitHub Actions
# Traducido desde .gitlab-ci.yml (ver odd/tasks/github-migration-translation.md)
#
# DESVIACIÓN DOCUMENTADA (sección 0 de la guía): en GitLab TODOS los jobs de
# este pipeline son tag-only (`.tag_rules`) y los jobs de deploy consumen los
# artifacts de los jobs `build` del mismo pipeline. En GitHub los artifacts no
# cruzan entre workflows, así que los 11 jobs viven en un único workflow.
#
# Mapeo de jobs (nombres idénticos a propósito: son los required checks):
#   backend_lint, backend_test, backend_assets_build, backend_build,
#   frontend_lint, frontend_test, frontend_build,
#   backend_deploy, frontend_deploy, rollback_backend, rollback_frontend
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      rollback_target:
        description: 'Rollback target: backend, frontend or both'
        required: false
        default: 'both'
        type: choice
        options:
          - backend
          - frontend
          - both
      tag:
        description: 'Tag to roll back to (empty = previous tag computed automatically)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_HOME: ${{ github.workspace }}/backend/.composer

jobs:
  # ============================================================
  # Lint stage
  # ============================================================

  # Gate de tag semver: las expresiones de GitHub Actions no tienen regex
  # (no existe `matches()`), asi que el filtro exacto de las tag rules de
  # GitLab (^vX.Y.Z con prerelease opcional) se evalua aqui en bash.
  # Salida `release`: 'true' solo para tags semver validas.
  release_gate:
    name: release_gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dryrun)\.[0-9]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  backend_lint:
    name: backend_lint
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor
            backend/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Run pint
        working-directory: backend
        run: vendor/bin/pint --test

  frontend_lint:
    name: frontend_lint
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: frontend
        run: pnpm run lint

  # ============================================================
  # Test stage
  # ============================================================

  backend_test:
    name: backend_test
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, backend_lint]
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor
            backend/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Prepare testing environment
        working-directory: backend
        run: |
          cp .env.testing.example .env
          composer install --prefer-dist --no-progress --no-interaction
          php artisan key:generate --force

      - name: Run Laravel tests
        working-directory: backend
        run: php artisan test

  frontend_test:
    name: frontend_test
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, frontend_lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: frontend
        run: pnpm run test:unit

  # ============================================================
  # Build stage
  # ============================================================

  backend_assets_build:
    name: backend_assets_build
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build backend assets
        working-directory: backend
        run: pnpm exec vite build

      - name: Upload backend assets
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: backend/public/build/
          retention-days: 1

  backend_build:
    name: backend_build
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, backend_assets_build]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Cache application
        working-directory: backend
        run: |
          php artisan config:cache
          php artisan route:cache

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/
          retention-days: 1

  frontend_build:
    name: frontend_build
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, frontend_lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm exec vite build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  # ============================================================
  # Deploy stage
  # ============================================================

  # ============================================================
  # Preflight SSH: verifica que la llave de CI este autorizada
  # en el servidor. Corre en paralelo con los builds, asi una
  # llave caida se detecta en segundos en vez de al final del
  # deploy, y el error dice exactamente que hacer.
  # ============================================================
  ssh_preflight:
    name: ssh_preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release_gate]
    if: always() && (needs.release_gate.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check deploy key against the server
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::the deploy key secret is empty" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "::error::the deploy key secret does not hold a valid private key" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config
          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
               -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'true'; then
            echo "::error::SSH preflight failed: the deploy key is not authorized on $SSH_USER@$SSH_HOST:$SSH_PORT. Add its public key in the hosting panel (SSH Keys) before releasing." >&2
            exit 1
          fi
          echo "SSH preflight OK"

  backend_deploy:
    name: backend_deploy
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, backend_lint, backend_test, backend_build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Verify the deploy key is authorized on the server
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'true'; then
            echo "::error::SSH preflight failed: the deploy key is not authorized on $SSH_USER@$SSH_HOST:$SSH_PORT. Add its public key in the hosting panel (SSH Keys) before releasing." >&2
            exit 1
          fi

      - name: Deploy backend
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_BACKEND: ${{ vars.DEPLOY_PATH_BACKEND }}
        run: |
          tar -czf /tmp/backend.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env*' \
            --exclude='storage/*' \
            --exclude='bootstrap/cache/*.php' \
            -C backend .
          scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_BACKEND &&
            tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
            cd $DEPLOY_PATH_BACKEND &&
            composer install --no-dev --optimize-autoloader &&
            php artisan migrate --force &&
            php artisan config:cache &&
            php artisan route:cache &&
            rm /tmp/backend.tar.gz
          "

  frontend_deploy:
    name: frontend_deploy
    runs-on: ubuntu-latest
    needs: [frontend_lint, frontend_test, frontend_build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      # GitLab Bajaba los artifacts del job frontend_build al workspace del
      # deploy (needs: [frontend_build]). En GitHub hay que bajarlos.
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Verify the deploy key is authorized on the server
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'true'; then
            echo "::error::SSH preflight failed: the deploy key is not authorized on $SSH_USER@$SSH_HOST:$SSH_PORT. Add its public key in the hosting panel (SSH Keys) before releasing." >&2
            exit 1
          fi

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_FRONTEND: ${{ vars.DEPLOY_PATH_FRONTEND }}
        run: |
          tar -czf /tmp/frontend.tar.gz -C frontend/dist .
          scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_FRONTEND &&
            tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
            rm /tmp/frontend.tar.gz
          "

  # ============================================================
  # Rollback stage (manual en GitLab -> workflow_dispatch)
  # ============================================================

  rollback_backend:
    name: rollback_backend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_target == 'backend' || inputs.rollback_target == 'both')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Verify the deploy key is authorized on the server
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'true'; then
            echo "::error::SSH preflight failed: the deploy key is not authorized on $SSH_USER@$SSH_HOST:$SSH_PORT. Add its public key in the hosting panel (SSH Keys) before releasing." >&2
            exit 1
          fi

      - name: Roll back backend
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_BACKEND: ${{ vars.DEPLOY_PATH_BACKEND }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            PREVIOUS_TAG="$REQUESTED_TAG"
          else
            PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
          fi
          if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
          echo "Rolling back to $PREVIOUS_TAG"
          git checkout "$PREVIOUS_TAG" -- backend/
          tar -czf /tmp/backend-rollback.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env*' \
            --exclude='storage/*' \
            --exclude='bootstrap/cache/*.php' \
            -C backend .
          scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_BACKEND &&
            tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
            cd $DEPLOY_PATH_BACKEND &&
            composer install --no-dev --optimize-autoloader &&
            php artisan migrate --force &&
            php artisan config:cache &&
            php artisan route:cache &&
            rm /tmp/backend-rollback.tar.gz
          "

  rollback_frontend:
    name: rollback_frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_target == 'frontend' || inputs.rollback_target == 'both')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Verify the deploy key is authorized on the server
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'true'; then
            echo "::error::SSH preflight failed: the deploy key is not authorized on $SSH_USER@$SSH_HOST:$SSH_PORT. Add its public key in the hosting panel (SSH Keys) before releasing." >&2
            exit 1
          fi

      - name: Roll back frontend
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_FRONTEND: ${{ vars.DEPLOY_PATH_FRONTEND }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            PREVIOUS_TAG="$REQUESTED_TAG"
          else
            PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
          fi
          if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
          echo "Rolling back to $PREVIOUS_TAG"
          git checkout "$PREVIOUS_TAG" -- frontend/
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          tar -czf /tmp/frontend-rollback.tar.gz -C frontend/dist .
          scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_FRONTEND &&
            tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
            rm /tmp/frontend-rollback.tar.gz
          "