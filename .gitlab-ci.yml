image: alpine:3.20

stages:
  - lint
  - test
  - build
  - deploy
  - rollback

variables:
  COMPOSER_HOME: "$CI_PROJECT_DIR/backend/.composer"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/vendor/
    - backend/.composer/cache/

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'

# Setup SSH comun: usa SSH_KNOWN_HOSTS (CI var masked) en vez de ssh-keyscan
.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - echo "Host *" > ~/.ssh/config
    - echo "  HostKeyAlgorithms +ssh-rsa" >> ~/.ssh/config
    - echo "  PubkeyAcceptedAlgorithms +ssh-rsa" >> ~/.ssh/config

# Setup composer comun: composer:2.8 + COMPOSER_HOME fijado
.composer_setup:
  before_script:
    - cd backend
    - export COMPOSER_HOME="$CI_PROJECT_DIR/backend/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# Setup composer para lint (sin scripts/migrate)
.composer_lint_setup:
  before_script:
    - cd backend
    - export COMPOSER_HOME="$CI_PROJECT_DIR/backend/.composer"
    - composer install --prefer-dist --no-progress --no-interaction --no-scripts

# Backend Laravel jobs
.backend_setup:
  before_script:
    - cd backend
    - export COMPOSER_HOME="$CI_PROJECT_DIR/backend/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# Frontend Ionic Vue jobs
.frontend_setup:
  before_script:
    - cd frontend
    - corepack enable
    - pnpm install --frozen-lockfile

backend_lint:
  stage: lint
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .composer_lint_setup]
  script:
    - vendor/bin/pint --test

backend_test:
  stage: test
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .composer_setup]
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  before_script:
    - cd backend
    - export COMPOSER_HOME="$CI_PROJECT_DIR/backend/.composer"
    - cp .env.testing.example .env
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan key:generate --force
  script:
    - php artisan test

backend_assets_build:
  stage: build
  image: node:24.4-alpine
  extends: [.tag_rules]
  before_script:
    - corepack enable
  script:
    - cd backend
    - pnpm install --frozen-lockfile
    - pnpm exec vite build
  artifacts:
    paths:
      - backend/public/build/
    expire_in: 1h

backend_build:
  stage: build
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .composer_setup]
  needs:
    - backend_assets_build
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction
    - php artisan config:cache
    - php artisan route:cache
  artifacts:
    paths:
      - backend/
    expire_in: 1h

frontend_lint:
  stage: lint
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run lint

frontend_test:
  stage: test
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run test:unit

frontend_build:
  stage: build
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm exec vite build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

backend_deploy:
  stage: deploy
  image: alpine:3.20
  extends:
    - .ssh_setup
    - .tag_rules
  needs:
    - backend_lint
    - backend_test
    - backend_build
  script:
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        -C backend .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine:3.20
  extends:
    - .ssh_setup
    - .tag_rules
  needs:
    - frontend_lint
    - frontend_test
    - frontend_build
  before_script:
    - !reference [.ssh_setup, before_script]
  script:
    - tar -czf /tmp/frontend.tar.gz -C frontend/dist .
    - scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend.tar.gz
      "

rollback_backend:
  stage: rollback
  image: alpine:3.20
  extends:
    - .ssh_setup
    - .tag_rules
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- backend/
      tar -czf /tmp/backend-rollback.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env*' \
        --exclude='storage/*' \
        --exclude='bootstrap/cache/*.php' \
        -C backend .
      scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend-rollback.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: node:24.4-alpine
  extends:
    - .ssh_setup
    - .tag_rules
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
    - corepack enable
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- frontend/
      cd frontend
      pnpm install --frozen-lockfile
      pnpm run build
      cd ..
      tar -czf /tmp/frontend-rollback.tar.gz -C frontend/dist .
      scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend-rollback.tar.gz
      "
