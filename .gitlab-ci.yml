image: alpine:latest

stages:
  - lint
  - test
  - build
  - deploy
  - post-deploy
  - rollback

variables:
  COMPOSER_HOME: "$CI_PROJECT_DIR/backend/.composer"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/vendor/
    - backend/.composer/cache/
    - frontend/.pnpm-store/

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa

.backend_setup:
  before_script:
    - cd backend

.frontend_setup:
  before_script:
    - cd frontend
    - corepack enable
    - pnpm install --frozen-lockfile

backend_lint:
  stage: lint
  image: php:8.3-cli
  extends:
    - .backend_setup
    - .tag_rules
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - vendor/bin/pint --test

backend_test:
  stage: test
  image: php:8.3-cli
  extends:
    - .backend_setup
    - .tag_rules
  variables:
    APP_KEY: $APP_KEY
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  script:
    - cp .env.testing.example .env
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan test --parallel

frontend_lint:
  stage: lint
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run lint

frontend_test:
  stage: test
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run test:unit

frontend_build:
  stage: build
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

backend_deploy:
  stage: deploy
  image: alpine
  extends:
    - .ssh_setup
    - .tag_rules
  needs:
    - backend_lint
    - backend_test
  script:
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        -C backend .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine
  extends:
    - .tag_rules
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache nodejs npm
    - cd frontend
    - corepack enable
    - pnpm install --frozen-lockfile
    - echo "VITE_API_URL=$VITE_API_URL" >> .env.production
  script:
    - pnpm run build
    - tar czvf dist.tar.gz dist/
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_FRONTEND && tar xzvf dist.tar.gz && rm dist.tar.gz"
  needs:
    - frontend_lint
    - frontend_test
    - frontend_build

post-deploy-backend:
  stage: post-deploy
  image: alpine
  extends:
    - .tag_rules
  needs:
    - backend_deploy
  before_script:
    - apk add --no-cache wget
  script:
    - wget -q -S --spider "$HEALTHCHECK_URL_BACKEND"

post-deploy-frontend:
  stage: post-deploy
  image: alpine
  extends:
    - .tag_rules
  needs:
    - frontend_deploy
  before_script:
    - apk add --no-cache wget
  script:
    - wget -q -S --spider "$HEALTHCHECK_URL_FRONTEND"

rollback_backend:
  stage: rollback
  image: alpine
  extends:
    - .ssh_setup
    - .tag_rules
  when: manual
  script:
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        -C backend .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: alpine
  extends:
    - .tag_rules
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache nodejs npm
  script:
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - cd frontend
    - corepack enable
    - pnpm install --frozen-lockfile
    - echo "VITE_API_URL=$VITE_API_URL" >> .env.production
    - pnpm run build
    - tar czvf dist.tar.gz dist/
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_FRONTEND && tar xzvf dist.tar.gz && rm dist.tar.gz"
