scalar DateTime
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar Upload
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

input LoginInput {
  user: String!
  password: String!
}
input RegisterInput {
  name: String!
  user: String!
  email: String!
  password: String!
}
type User {
  id: ID!
  name: String!
  email: String!
  is_email_verified: String!
  is_admin: Boolean!
  role: [String]
  user: String!
}
type Post {
  id: ID!
  title: String!
  content: String!
}
type UserAuth {
  access_token: String
  token_type: String
}
type PayloadLogin {
  msg: String!
  user: [User]
  auth: [UserAuth]
}
type PayloadRegister {
  msg: String!
  user: [User]
  auth: [UserAuth]
}

type Query {
  user(
    id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
    email: String
      @eq
      @rules(apply: ["prohibits:id", "required_without:id", "email"])
  ): User @find

  users(name: String @where(operator: "like")): [User!]!
    @paginate(defaultCount: 10)

  post(id: Int! @eq): Post @find
  posts: [Post!]! @all
  posts_images: [Post!]! @all
}

###### mutations
type Mutation {
  login(input: LoginInput @spread): PayloadLogin
    @field(resolver: "App\\GraphQL\\Resolvers\\LoginResolver@resolve")
  register(input: RegisterInput @spread): PayloadRegister
    @field(resolver: "App\\GraphQL\\Resolvers\\RegisterResolver@resolve")
}
