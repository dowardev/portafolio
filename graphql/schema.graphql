scalar DateTime
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar Upload
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

input LoginInput {
  user: String!
  password: String!
}
input RegisterInput {
  name: String!
  user: String!
  email: String!
  password: String!
}
input ForgotPasswordInput {
  email: String!
}
input CodeForgotPasswordInput {
  email: String!
  code: Int!
}
input RestoreUserPasswordInput {
  code: String!
  email: String!
  password: String!
}
input CreatePostInput {
  title: String!
  content: String!
  coverId: ID!
  images: [ID]
}
input UpdatePostInput {
  id: ID!
  title: String!
  content: String!
  coverId: ID
  newCoverId: ID
  images: [String]
  imagesRemoved: [String]
}
input DeletePostInput {
  id: ID!
}
input FileInput {
  file: Upload!
}
input ImageInput {
  id: String
  name: String
}
input PostsInput {
  title: String!
  content: String!
}
input FeedbackInput {
  user_id: String
  name: String
  email: String
  description: String!
  contact_me: Boolean!
}

type User {
  id: ID!
  name: String!
  email: String!
  is_email_verified: String!
  is_admin: Boolean!
  role: [String]
  user: String!
}
type Post {
  id: ID
  title: String!
  content: String!
  cover: Image! @belongsTo(relation: "cover")
  created_at: String
  updated_at: String
}
type GetPost {
  message: String!
  posts: [Post]!
}
type UserAuth {
  access_token: String!
  token_type: String!
}
type PostsDate {
  message: String!
  date: String!
}
type PostsDates {
  message: String!
  dates: [String]!
}

# payloads
type LoginPayload {
  message: String!
  auth: UserAuth!
  user: [User]!
}
type RegisterPayload {
  message: String!
  user: User!
  auth: UserAuth!
}
type ForgotPasswordPayload {
  message: String!
}
type RestoreUserPasswordPayload {
  message: String!
}
type GetUserAuthPayload {
  message: String!
  user: User!
}
type CreatePostPayload {
  message: String!
}
type UpdatePostPayload {
  message: String!
}
type DeletePostPayload {
  message: String!
}
type Image {
  id: ID
  name: String!
  path: String!
  source: String!
}
type UploadImagePayload {
  message: String!
  image: Image!
}
type GetImagePayload {
  message: String!
  image: Image!
}
type PostImage {
  id: ID
  image_id: ID
  post_id: ID
}
type CreateFeedbackPayload {
  message: String!
}

type Query {
  # user(
  #   id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
  #   email: String
  #     @eq
  #     @rules(apply: ["prohibits:id", "required_without:id", "email"])
  # ): User @find

  # users(name: String @where(operator: "like")): [User!]!
  #   @paginate(defaultCount: 10)

  post(id: ID! @eq): Post @find

  posts(date: String): GetPost
    @field(resolver: "App\\GraphQL\\Resolvers\\post\\GetPostsResolver@resolve")

  recentDatePosts: PostsDate!
    @field(
      resolver: "App\\GraphQL\\Resolvers\\post\\RecentPostsDateResolver@resolve"
    )

  # getNextPostDate(date: String, option: String): PostsDates!
  #   @field(
  #     resolver: "App\\GraphQL\\Resolvers\\post\\PostsDatesResolver@resolve"
  #   )

  getDates(currentDate: String): PostsDates!
    @field(
      resolver: "App\\GraphQL\\Resolvers\\post\\PostsDatesResolver@resolve"
    )
}

type Mutation {
  login(input: LoginInput @spread): LoginPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\LoginResolver@resolve")

  register(input: RegisterInput @spread): RegisterPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\RegisterResolver@resolve")

  forgotPassword(input: ForgotPasswordInput @spread): ForgotPasswordPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\ForgotPasswordResolver@resolve"
    )

  restoreUserPassword(
    input: RestoreUserPasswordInput @spread
  ): RestoreUserPasswordPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\RestoreUserPasswordResolver@resolve"
    )

  userLogout: ForgotPasswordPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\UserLogoutResolver@resolve"
    )

  getUserAuth: GetUserAuthPayload
    @guard
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\GetUserAuthResolver@resolve"
    )

  createPost(input: CreatePostInput! @spread): CreatePostPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\post\\CreatePostResolver@resolve"
    )

  updatePost(input: UpdatePostInput @spread): UpdatePostPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\post\\UpdatePostResolver@resolve"
    )

  deletePost(input: DeletePostInput @spread): DeletePostPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\post\\DeletePostResolver@resolve"
    )

  uploadImage(input: FileInput @spread): UploadImagePayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\others\\UploadImageResolver@resolve"
    )

  getImage(input: ImageInput @spread): GetImagePayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\others\\GetImageResolver@resolve"
    )

  createFeedback(input: FeedbackInput @spread): CreateFeedbackPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\others\\CreateFeedbackResolver@resolve"
    )
}
